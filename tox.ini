[tox]
requires = tox>=4.2
env_list = py310, py311, py312
package_root = {tox_root}/bindings/python

[testenv]
description = Build and test the Python bindings on {base_python}
package = wheel
deps =
    pytest>=8,<10
    tomli>=2; python_version < "3.11"
change_dir = {env_tmp_dir}
commands = python -I -m pytest -c {tox_root}/tox.ini {tox_root}/bindings/python/tests {posargs}

[pytest]
testpaths = bindings/python/tests
addopts = --import-mode=importlib
