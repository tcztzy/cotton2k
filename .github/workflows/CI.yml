name: Python CI

on:
  push:
  pull_request:

jobs:
  wheels:
    name: wheels-${{ matrix.os }}-${{ matrix.target }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo-target: x86_64-unknown-linux-gnu
            manylinux: auto
            maturin-extra-args: ""
          - os: macos-13
            target: universal2-apple-darwin
            cargo-target: x86_64-apple-darwin
            manylinux: off
            maturin-extra-args: --universal2
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo-target: x86_64-pc-windows-msvc
            manylinux: off
            maturin-extra-args: ""
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Add aarch64 Rust target for macOS universal2
        if: matrix.target == 'universal2-apple-darwin'
        run: rustup target add aarch64-apple-darwin
      - uses: PyO3/maturin-action@v1.49.4
        with:
          command: build
          target: ${{ matrix.cargo-target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked -i python${{ matrix.python-version }} --no-sdist -o dist --manifest-path bindings/python/Cargo.toml ${{ matrix.maturin-extra-args }}
      - name: Upload wheels
        uses: actions/upload-artifact@v5.0.0
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist/*.whl

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels]
    steps:
      - uses: actions/download-artifact@v6.0.0
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1.49.4
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing dist/*.whl
