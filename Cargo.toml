[package]
name = "cotton2k"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of the Cotton2K crop simulation model."
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/tcztzy/cotton2k"
keywords = ["cotton", "simulation", "agriculture"]
categories = ["science"]
exclude = [".agents/", ".claude/"]

[dependencies]
chrono = "0.4"
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
pbr = "1.1"
ndarray = "0.17"
uom = "0.37"
num_cpus = "1.17"
